# 賽特神諭文章後台（Pages CMS）
# 需要用 GitHub 授權 Pages CMS App 才能編輯
media:
  input: media/guides
  output: /media/guides

content:
  - name: tutorials
    label: 攻略文章管理
    type: collection
    path: _tutorials
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}-{minute}-{second}.md"
    view:
      fields: [title, category, published, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: 文章標題
        type: string
        required: true
      - name: description
        label: 文章摘要
        type: text
        required: true
      - name: category
        label: 文章分類
        type: select
        required: true
        options:
          values:
            - 新手入門
            - 功能教學
            - 遊戲攻略
            - 數據觀念
            - 資金控管
            - 安全防護
      - name: cover
        label: 封面圖片
        type: image
        description: 建議 16:9 橫圖，可以選擇已有圖片或上傳新圖片
      - name: order
        label: 顯示順序
        type: number
        required: true
        description: 數字越小越前面，新增文章請填 10、11...
      - name: published
        label: 公開發布
        type: boolean
        default: true
        description: 關閉後文章不會出現在官網
      - name: body
        label: 文章內文（可插入圖片）
        type: rich-text
        options:
          format: markdown
          switcher: true
          rename: true

  - name: feature_docs
    label: 核心功能教學管理
    type: collection
    path: _feature_docs
    format: yaml-frontmatter
    view:
      fields: [card_order, card_title, title]
      primary: card_title
      sort: [card_order, card_title]
      default:
        sort: card_order
        order: asc
    fields:
      - name: card_title
        label: 首頁卡片名稱
        type: string
        required: true
        description: 修改後同步顯示於官網首頁六大核心功能
      - name: card_icon
        label: 首頁卡片圖示或表情
        type: string
        required: true
        description: 例如 ◎ ⚡ ◇，建議使用一個符號
      - name: card_order
        label: 首頁卡片顯示順序
        type: number
        required: true
        description: 數字越小排列越前面
      - name: title
        label: 教學文章標題
        type: string
        required: true
      - name: description
        label: 功能簡介
        type: text
        required: true
      - name: image1
        label: 第一張教學圖片
        type: image
      - name: image1_caption
        label: 第一張圖片標題
        type: string
      - name: image1_description
        label: 第一張圖片說明
        type: text
      - name: image2
        label: 第二張教學圖片
        type: image
      - name: image2_caption
        label: 第二張圖片標題
        type: string
      - name: image2_description
        label: 第二張圖片說明
        type: text
      - name: youtube_url
        label: YouTube 教學影片連結
        type: string
        description: 貼上影片網址（youtu.be、youtube.com/watch 或 Shorts），不填就不顯示
      - name: mp4_url
        label: MP4 影片網址（大檔案建議使用）
        type: string
        description: 貼上公開、可直接播放的 HTTPS .mp4 影片網址；非 YouTube 影片網址，不填就不顯示
      - name: mp4_file
        label: 上傳 MP4 教學影片
        type: file
        description: Pages CMS 上傳可能超過約 4.5MB 就出現 413；大影片請改用上方 MP4 網址欄位
        options:
          extensions: [mp4]
          categories: [video]
      - name: body
        label: 詳細教學內容（可插入圖片）
        type: rich-text
        options:
          format: markdown
          switcher: true
          rename: true

  - name: reviews
    label: 玩家評價管理
    type: collection
    path: _reviews
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}-{minute}-{second}.md"
    view:
      fields: [nickname, rating, published, order]
      primary: nickname
      sort: [order, nickname]
    fields:
      - name: nickname
        label: 玩家公開暱稱
        type: string
        required: true
      - name: rating
        label: 使用體驗評分（1～5）
        type: number
        required: true
      - name: date
        label: 評價日期
        type: date
      - name: content
        label: 玩家心得
        type: text
        required: true
      - name: photos
        label: 玩家心得照片（可新增多張）
        type: image
        list: true
        description: 玩家透過 LINE 提供照片後，由管理員審核並逐張新增；可不限制張數
        options:
          extensions: [jpg, png, webp]
      - name: reply
        label: 官方回覆（選填）
        type: text
      - name: order
        label: 顯示順序（小數字優先）
        type: number
        default: 10
      - name: published
        label: 公開顯示（審核後才開啟）
        type: boolean
        default: false
