</style></head><body><header><a class="brand" href="/"><img src="/favicon.png" alt=""><strong>賽特神諭</strong></a><a href="/">返回首頁</a></header><main><h1>獨家優惠</h1><p>左右翻頁・點擊圖片放大查看</p><div id="book" class="book" aria-label="圖片書冊"></div><p id="empty" hidden>目前尚無圖片。</p><div class="controls"><button id="prev" type="button">❮ 上一頁</button><span id="count" aria-live="polite"></span><button id="next" type="button">下一頁 ❯</button></div><section id="offer-notes" aria-labelledby="offer-notes-title"><h2 id="offer-notes-title">活動注意事項：</h2><ol><li>年末豪禮抽獎活動需至<a href="https://lin.ee/xEaQWMq">《LINE官方》</a>登記抽獎序號</li><li>電子復仇金需至<a href="https://gs42oj.hd5957.com/promotion">《皇鼎優惠》</a>自行申請</li><li>轉進免遊加碼送需至<a href="https://seth-oracle.github.io/reviews/">《玩家評價》</a>上傳評價即可申請</li></ol></section></main><dialog id="zoom" aria-label="圖片放大"><button id="close" type="button" aria-label="關閉">×</button><img id="large" alt=""></dialog><script>
(()=>{const book=document.getElementById('book'),empty=document.getElementById('empty'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count'),zoom=document.getElementById('zoom'),large=document.getElementById('large'),mq=matchMedia('(max-width:700px)');let pages=[],pos=0,start=null,busy=false,suppressClick=0;const step=()=>2;const previews={% if site.data.offer_previews %}{{ site.data.offer_previews | jsonify }}{% else %}[]{% endif %};const previewFor=p=>previews.find(x=>x.image===p.image)?.preview||p.image;const warmed=new Map();function warmNearby(){for(let k=Math.max(0,pos-2);k<Math.min(pages.length,pos+4);k++){const p=pages[k];if(!p||warmed.has(previewFor(p)))continue;const img=new Image();img.decoding='async';img.fetchPriority=k<pos+2?'high':'low';img.src=previewFor(p);warmed.set(previewFor(p),img);if(img.decode)img.decode().catch(()=>{});}}const valid=s=>typeof s==='string'&&(/^\/(?!\/)/.test(s)||/^https:\/\//i.test(s));function render(){book.replaceChildren();book.hidden=false;empty.hidden=true;prev.disabled=pos===0;next.disabled=pos+step()>=pages.length;count.textContent=pages.length?(pos+1)+(step()===2&&pos+1<pages.length?'–'+(pos+2):'')+' / '+pages.length:'0 / 0';for(let n=0;n<step();n++){const p=pages[pos+n],leaf=document.createElement('div');leaf.className='leaf turn';leaf.dataset.page=p?String(pos+n+1).padStart(2,'0'):'';if(p){const b=document.createElement('button'),img=new Image();img.fetchPriority='high';img.loading='eager';img.src=previewFor(p);img.onerror=()=>{img.onerror=null;img.src=p.image;};img.alt=p.title||'圖片 '+(pos+n+1);img.decoding='async';b.setAttribute('aria-label','放大 '+img.alt);b.append(img);b.onclick=()=>{if(busy||Date.now()<suppressClick)return;large.src=p.image;large.alt=img.alt;zoom.showModal()};leaf.append(b)}else{const placeholder=document.createElement('div');placeholder.className='blank-page';placeholder.innerHTML='<span aria-hidden="true">◇</span><strong>獨家優惠</strong><small>目前尚無圖片</small>';leaf.append(placeholder)}book.append(leaf)}}function move(dir){const n=pos+dir*step();if(busy||n<0||n>=pages.length)return;if(matchMedia('(prefers-reduced-motion: reduce)').matches){pos=n;render();warmNearby();return;}busy=true;const turning=dir>0?1:0,stationary=1-turning,oldLeaf=book.children[turning],oldStationary=book.children[stationary],rect=oldLeaf.getBoundingClientRect(),base=book.getBoundingClientRect(),front=oldLeaf.cloneNode(true);pos=n;render();const newLeaf=book.children[stationary],rear=newLeaf.cloneNode(true);newLeaf.replaceWith(oldStationary);const sheet=document.createElement('div');sheet.className='turn-sheet'+(dir<0?' reverse':'');Object.assign(sheet.style,{left:(rect.left-base.left-book.clientLeft)+'px',top:(rect.top-base.top-book.clientTop)+'px',width:rect.width+'px',height:rect.height+'px'});front.className='leaf front';rear.className='leaf rear';sheet.append(front,rear);book.append(sheet);prev.disabled=next.disabled=true;let done=false;const finish=()=>{if(done)return;done=true;sheet.remove();oldStationary.replaceWith(newLeaf);busy=false;prev.disabled=pos===0;next.disabled=pos+step()>=pages.length;warmNearby()};if(typeof sheet.animate!=='function'){finish();return;}const anim=sheet.animate([{transform:'rotateY(0deg)'},{transform:'rotateY('+(dir>0?-90:90)+'deg)',offset:.5},{transform:'rotateY('+(dir>0?-180:180)+'deg)'}],{duration:600,easing:'cubic-bezier(.35,.1,.25,1)',fill:'forwards'});anim.onfinish=finish;anim.oncancel=finish;setTimeout(finish,800)}prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.getElementById('close').onclick=()=>zoom.close();zoom.onclick=e=>{if(e.target===zoom)zoom.close()};mq.addEventListener('change',()=>{if(!busy)render()});book.addEventListener('touchstart',e=>{start=e.changedTouches[0].clientX},{passive:true});book.addEventListener('touchend',e=>{if(start===null)return;const d=e.changedTouches[0].clientX-start;start=null;if(Math.abs(d)>50){suppressClick=Date.now()+550;move(d<0?1:-1)}},{passive:true});document.addEventListener('keydown',e=>{if(zoom.open)return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});render();fetch('/offers/pages.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(c=>{pages=(Array.isArray(c.pages)?c.pages:[]).filter(p=>p&&p.enabled!==false&&valid(p.image));render();warmNearby()}).catch(()=>{render();empty.hidden=false;empty.textContent='圖片暫時無法讀取，請重新整理。'})})();
</script></body></html>
