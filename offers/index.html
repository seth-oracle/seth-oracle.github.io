<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>獨家優惠｜賽特神諭</title><link rel="icon" href="/favicon.png"><meta name="robots" content="noindex"><style>
*{box-sizing:border-box}body{margin:0;color:#553519;font-family:system-ui,"Microsoft JhengHei",sans-serif;background:transparent;min-height:100vh}header{display:flex;align-items:center;justify-content:space-between;padding:16px 5vw;background:#f5e8cf;border-bottom:1px solid #b98b45}a{color:inherit}main{max-width:980px;margin:auto;padding:24px 14px;text-align:center}h1{font-size:clamp(25px,5vw,42px);margin:12px 0;color:#744515;text-shadow:0 1px #fff3d8}.book{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:12px;background:#63401f;border:3px solid #bc8b37;border-radius:14px;box-shadow:0 14px 35px #57361955;perspective:1200px}.leaf{min-width:0;aspect-ratio:3/4;background:linear-gradient(90deg,#dfc49a,#fff2d6 12%,#f9e8c7 88%,#d6b88b);border:1px solid #c6a16b;border-radius:5px 12px 12px 5px;padding:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}.leaf button{border:0;background:none;padding:0;width:100%;height:100%;min-height:0;cursor:zoom-in}.leaf img{width:100%;height:100%;object-fit:contain;display:block}.leaf.turn{animation:turn .35s ease-out}@keyframes turn{from{opacity:.35;transform:rotateY(-12deg)}to{opacity:1;transform:rotateY(0)}}.controls{display:flex;justify-content:center;align-items:center;gap:16px;margin:20px 0}.controls button{background:linear-gradient(#fff0c9,#d8aa5c);border:1px solid #a97835;color:#573519;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer}.controls button:disabled{opacity:.4;cursor:default}dialog{max-width:96vw;max-height:94dvh;padding:8px;border:2px solid #c69a51;border-radius:12px;background:#24190e;overflow:visible}dialog::backdrop{background:#000c}dialog img{display:block;max-width:90vw;max-height:85dvh;object-fit:contain}#close{position:absolute;right:5px;top:5px;background:#24190e;color:#fff;border:1px solid #e6c17b;border-radius:50%;width:40px;height:40px;font-size:24px;cursor:pointer}#empty{padding:50px 12px} @media(max-width:700px){.book{grid-template-columns:1fr;max-width:450px;margin:auto;padding:8px}.leaf{padding:8px}.controls{gap:10px}}@media(prefers-reduced-motion:reduce){.leaf.turn{animation:none}}
html{background:#f0e5d5}body{position:relative;isolation:isolate}body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:#f0e5d5 url("/assets/photo_2026-11-19_18-11-07.jpg") center top / min(100vw, 1152px) auto repeat;}
</style></head><body><header><strong>賽特神諭</strong><a href="/">返回首頁</a></header><main><h1>獨家優惠</h1><p>左右翻頁・點擊圖片放大查看</p><div id="book" class="book" aria-label="圖片書冊"></div><p id="empty" hidden>目前尚無圖片。</p><div class="controls"><button id="prev" type="button">❮ 上一頁</button><span id="count" aria-live="polite"></span><button id="next" type="button">下一頁 ❯</button></div></main><dialog id="zoom" aria-label="圖片放大"><button id="close" type="button" aria-label="關閉">×</button><img id="large" alt=""></dialog><script>
(()=>{const book=document.getElementById('book'),empty=document.getElementById('empty'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count'),zoom=document.getElementById('zoom'),large=document.getElementById('large'),mq=matchMedia('(max-width:700px)');let pages=[],pos=0,start=null;const step=()=>mq.matches?1:2;const valid=s=>typeof s==='string'&&(/^\/(?!\/)/.test(s)||/^https:\/\//i.test(s));function render(){book.replaceChildren();book.hidden=!pages.length;empty.hidden=!!pages.length;prev.disabled=pos===0;next.disabled=pos+step()>=pages.length;count.textContent=pages.length?(pos+1)+(step()===2&&pos+1<pages.length?'–'+(pos+2):'')+' / '+pages.length:'0 / 0';if(!pages.length)return;for(let n=0;n<step();n++){const p=pages[pos+n],leaf=document.createElement('div');leaf.className='leaf turn';if(p){const b=document.createElement('button'),img=new Image();img.src=p.image;img.alt=p.title||'圖片 '+(pos+n+1);img.decoding='async';b.setAttribute('aria-label','放大 '+img.alt);b.append(img);b.onclick=()=>{large.src=p.image;large.alt=img.alt;zoom.showModal()};leaf.append(b)}book.append(leaf)}}function move(dir){const n=pos+dir*step();if(n>=0&&n<pages.length){pos=n;render()}}prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.getElementById('close').onclick=()=>zoom.close();zoom.onclick=e=>{if(e.target===zoom)zoom.close()};mq.addEventListener('change',()=>{pos=Math.floor(pos/step())*step();render()});book.addEventListener('touchstart',e=>{start=e.changedTouches[0].clientX},{passive:true});book.addEventListener('touchend',e=>{if(start===null)return;const d=e.changedTouches[0].clientX-start;start=null;if(Math.abs(d)>50)move(d<0?1:-1)},{passive:true});document.addEventListener('keydown',e=>{if(zoom.open)return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});fetch('/offers/pages.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(c=>{pages=(Array.isArray(c.pages)?c.pages:[]).filter(p=>p&&p.enabled!==false&&valid(p.image));render()}).catch(()=>{render();empty.textContent='圖片暫時無法讀取，請重新整理。'})})();
</script></body></html>
