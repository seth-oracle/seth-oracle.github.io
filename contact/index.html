<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;color:#492e18;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.sitebar{display:flex;justify-content:space-between;align-items:center;padding:14px max(17px,5vw);gap:12px;border-bottom:1px solid #bc9867;background:#f7ebd6eb}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:.1em;font-size:19px;color:#66401e}
.brand img{width:36px;height:36px;border-radius:7px}
.back{font-size:13px;font-weight:650;color:#6c482b}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 70px}
.eyebrow{font-size:11px;letter-spacing:.19em;color:#886139;font-weight:750;margin:0 0 5px}
h1{font-size:clamp(28px,6vw,38px);margin:0 0 8px;color:#633b1b;line-height:1.3}
.intro{font-size:14px;line-height:1.8;color:#6e5239;margin:0 0 25px}
.channel{padding:22px 20px;background:linear-gradient(130deg,#fff6e7f2,#ead1a7f2);border:1px solid #bc955a;border-radius:17px;box-shadow:0 7px 22px #593a1721;margin:16px 0}
.channel-top{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.channel-symbol{display:grid;place-items:center;width:55px;height:55px;border-radius:50%;font-size:24px;flex-shrink:0}
.line-symbol{background:#e1ffe9;color:#08a548}
.brand-symbol{background:transparent!important;padding:0;overflow:hidden}
.brand-symbol img{display:block;width:100%;height:100%;object-fit:contain}
.telegram-symbol{background:#e0f3ff;color:#2086bc}
.channel h2{font-size:22px;line-height:1.25;margin:0 0 5px;color:#543316}
.channel-top p{margin:0;font-size:13px;color:#755539}
.copy-row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:11px 13px;background:#fffaf1;border:1px solid #d4b385;border-radius:12px;min-height:64px}
.copy-row code{font-size:clamp(12px,3.7vw,16px);font-weight:750;color:#4a2d16;overflow-wrap:anywhere}
.copy-row button{white-space:nowrap;padding:9px 12px;border-radius:9px;border:1px solid #d9bb91;background:#f6eddc;color:#593814;font-size:13px;font-weight:800}
.channel-action{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 15px;min-height:60px;max-width:320px;margin:17px auto 0;border-radius:10px;font-size:20px;font-weight:900}
.channel-action.line{background:#06bf35;color:white}
.channel-action.telegram{background:#238fc1;color:white}
.channel-action.disabled{background:#e2d4bd;color:#735a3c;cursor:default}
.channel-action svg{width:27px;height:27px;flex-shrink:0}
.tip{font-size:12px;color:#72553a;text-align:center;line-height:1.7;margin:22px 0}
@media(max-width:600px){.wrap{padding:24px 16px 50px}.channel{padding:22px 19px}.channel-action{max-width:250px}}
</style>
</head>
<body class="oak-subpage">
<header class="sitebar">
 <a class="brand" href="/"><img src="https://xinyao-ai.github.io/xinyao-ai/icon-192.png" alt="" width="36" height="36">賽特神諭</a>

<main class="wrap">
 <p class="eyebrow">SETH ORACLE · SUPPORT</p>
 <h1>聯繫我們</h1>
 <p class="intro">有任何系統使用或安裝問題，歡迎透過以下官方管道聯繫我們。</p>
 <section class="channel" aria-labelledby="line-title">
  <div class="channel-top"><div class="channel-symbol brand-symbol" aria-hidden="true"><img src="/LINE_logo.svg" alt="" width="55" height="55" decoding="async"></div><div><h2 id="line-title">官方 LINE</h2><p>聯繫賽特神諭官方客服</p></div></div>
  <div class="copy-row"><code id="lineAccount">@999cuulj</code><button type="button" data-copy="@999cuulj" aria-label="複製官方 LINE 帳號">複製帳號</button></div>
  <a class="channel-action line" href="https://lin.ee/TOLUjbR" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 28 28" aria-hidden="true"><path fill="white" d="M14 2C7.3 2 2 6.3 2 11.8c0 4.7 3.8 8.6 9 9.3l-.6 4.5 5.1-4c6-.6 10.5-4.7 10.5-9.8C26 6.3 20.7 2 14 2Z"/><text x="14" y="14.7" font-size="7" fill="#08b73c" font-weight="bold" text-anchor="middle">LINE</text></svg>加入好友</a>
 </section>
 <section class="channel" aria-labelledby="telegram-title">
  <div class="channel-top"><div class="channel-symbol brand-symbol" aria-hidden="true"><img src="/Telegram_logo.svg.webp" alt="" width="55" height="55" decoding="async"></div><div><h2 id="telegram-title">Telegram</h2><p>聯繫客服／作者</p></div></div>
  <div class="copy-row"><code id="telegramAccount">@oracle16899</code><button type="button" data-copy="@oracle16899" aria-label="複製 Telegram 帳號">複製帳號</button></div>
  <a class="channel-action telegram" href="https://t.me/oracle16899" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">✈</span>開啟 Telegram</a>
 </section>
 <p class="tip">客服回覆時間以官方公告為準，請勿透過非官方管道提供密碼或驗證碼。</p>
</main>
<script>
document.querySelectorAll('button[data-copy]').forEach(btn=>btn.addEventListener('click',async()=>{
 const label=btn.textContent;
 try {
   if(navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(btn.dataset.copy);
   else {const field=document.createElement('textarea');field.value=btn.dataset.copy;document.body.appendChild(field);field.select();if(!document.execCommand('copy'))throw Error('copy unavailable');field.remove();}
   btn.textContent='已複製 ✓';
 }catch(e){btn.textContent='長按複製';}
 setTimeout(()=>btn.textContent=label,1800);
}));
</script>
</body></html>
