name: Optimize booklet previews
on:
  workflow_dispatch:
  push:
    paths:
      - 'offers/pages.json'
      - 'scripts/optimize_offer_images.py'
      - '.github/workflows/optimize-offer-images.yml'
permissions:
  contents: write
concurrency:
  group: optimize-offer-images
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: python scripts/optimize_offer_images.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/offer_previews.json
          git add -- '*.offer-preview.webp'
          if ! git diff --cached --quiet; then
            git commit -m "Generate lightweight booklet previews"
            git pull --rebase
            git push
          fi
