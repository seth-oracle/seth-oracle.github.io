name: Optimize homepage image delivery
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/optimize-homepage-images.yml"
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --quiet 'Pillow>=10,<13'
      - name: Generate optimized WebP and update homepage links
        run: python scripts/optimize_homepage_images.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html '*.webp' '**/*.webp'
          if ! git diff --cached --quiet; then
            git commit -m "Serve optimized WebP homepage images"
            git push
          fi
