<style id="oracle-video-guide-style">

    .oracle-video-secondary{border:1px solid #ab8552;color:#5b3b1c;background:#f9f1e5}
    @media(max-width:650px){.oracle-video-section{padding:38px 15px 48px}.oracle-video-shell{flex-direction:column;gap:19px;padding:18px 13px}.oracle-video-player{width:min(100%,255px)}.oracle-video-info{text-align:center}.oracle-video-info h3{font-size:19px}.oracle-video-info p{font-size:13px}.oracle-video-link,.oracle-video-secondary{margin:10px auto}}

    .oracle-youtube-more{max-width:740px;margin:18px auto 0;display:flex;justify-content:space-between;align-items:center;gap:12px;color:#6e4b2a;font-size:13px}
