<script>
(function(){
  const track=document.getElementById('oracleVideoTrack');
  const previous=document.getElementById('videoPrev');
  const next=document.getElementById('videoNext');
  const modal=document.getElementById('oracleVideoModal');
  const frame=document.getElementById('oracleModalFrame');
  const close=document.getElementById('oracleVideoClose');
  let opener=null;
  function updateArrows(){
    previous.disabled=track.scrollLeft<=2;
    next.disabled=track.scrollLeft+track.clientWidth>=track.scrollWidth-2;
  }
  function slide(dir){
    const card=track.querySelector('.oracle-video-card');
    if(!card)return;
    const gap=parseFloat(getComputedStyle(track).gap)||0;
    const width=card.getBoundingClientRect().width+gap;
    track.scrollBy({left:width*dir* (matchMedia('(max-width:650px)').matches?2:4),behavior:'smooth'});
  }
  previous.addEventListener('click',()=>slide(-1));
  next.addEventListener('click',()=>slide(1));
  track.addEventListener('scroll',updateArrows,{passive:true});
  window.addEventListener('resize',updateArrows);
  updateArrows();
  track.addEventListener('click',e=>{
    const btn=e.target.closest('button[data-video-id]');
    if(!btn)return;
    const id=btn.dataset.videoId;
    if(!/^[a-zA-Z0-9_-]{11}$/.test(id))return;
    opener=btn;
    const iframe=document.createElement('iframe');
    iframe.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1';
    iframe.title=btn.dataset.videoTitle||'YouTube 影片';
    iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    iframe.referrerPolicy='strict-origin-when-cross-origin';
    iframe.allowFullscreen=true;
    frame.replaceChildren(iframe);
    modal.hidden=false;
    document.body.style.overflow='hidden';
    close.focus();
  });
  function hide(){
    if(modal.hidden)return;
    modal.hidden=true;
    frame.replaceChildren();
    document.body.style.overflow='';
    if(opener)opener.focus();
  }
  close.addEventListener('click',hide);
  modal.addEventListener('click',e=>{if(e.target===modal)hide()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
})();
</script>
