name = "seth-review-service"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Configure these bindings after creating the D1 database and free KV namespace.
[[d1_databases]]
binding = "DB"
database_name = "seth-reviews"
database_id = "aecbaf79-70df-4d53-9401-fb42022ad836"

[[kv_namespaces]]
binding = "PHOTOS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
SITE_ORIGIN = "https://seth-oracle.github.io"
